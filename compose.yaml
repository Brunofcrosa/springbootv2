services:
  postgres:
    image: postgres:16-alpine
    container_name: salas-postgres
    environment:
      POSTGRES_DB: salasdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5499:5432"
    volumes:
      - salas-postgres-data:/var/lib/postgresql/data

volumes:
  salas-postgres-data:
